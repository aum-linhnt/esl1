services:
  app:
    image: webdevops/php-apache:8.3
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-esl}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-esl}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-esl_secret}
    volumes:
      - ./:/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-3011}:3306"
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-esl}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-esl}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-esl_secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./esl.sql:/docker-entrypoint-initdb.d/01-esl.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
