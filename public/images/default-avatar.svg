<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background with rounded rectangle / circle -->
  <rect width="128" height="128" rx="28" fill="url(#avatarGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  
  <!-- User Figure -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <circle cx="64" cy="46" r="21" fill="url(#silhouetteGrad)"/>
    <!-- Body / Shoulders -->
    <path d="M26 108 C26 84, 42 76, 64 76 C86 76, 102 84, 102 108 Z" fill="url(#silhouetteGrad)"/>
  </g>
</svg>
